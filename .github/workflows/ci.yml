name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run smoke tests
        run: |
          pytest -q

      - name: Build Docker image
        run: |
          docker build -t batch-ml-project1:${{ github.sha }} .

      - name: Basic container smoke check
        run: |
          docker run --rm batch-ml-project1:${{ github.sha }} python --version
