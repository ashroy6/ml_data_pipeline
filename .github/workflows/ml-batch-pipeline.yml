name: ML Batch Pipeline

on:
  workflow_dispatch:

jobs:
  train:
    name: Train Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create output folders
        run: |
          mkdir -p models
          mkdir -p reports

      - name: Build Docker image
        run: |
          docker build -t batch-ml-project1:${{ github.sha }} .

      - name: Run training in container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/data:/app/data \
            -v ${{ github.workspace }}/models:/app/models \
            batch-ml-project1:${{ github.sha }} \
            python src/train.py | tee reports/train_output.txt

      - name: Verify trained model exists
        run: |
          test -f models/model.pkl

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.pkl

      - name: Upload training report
        uses: actions/upload-artifact@v4
        with:
          name: training-report
          path: reports/train_output.txt

  predict:
    name: Predict Batch
    runs-on: ubuntu-latest
    needs: train

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create runtime folders
        run: |
          mkdir -p input output archive failed logs models

      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models

      - name: Ensure model exists
        run: |
          test -f models/model.pkl

      - name: Ensure input file exists
        run: |
          ls -l input
          test -f input/input_data.csv

      - name: Build Docker image
        run: |
          docker build -t batch-ml-project1:${{ github.sha }} .

      - name: Run prediction in container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/input:/app/input \
            -v ${{ github.workspace }}/output:/app/output \
            -v ${{ github.workspace }}/models:/app/models \
            -v ${{ github.workspace }}/archive:/app/archive \
            -v ${{ github.workspace }}/failed:/app/failed \
            -v ${{ github.workspace }}/logs:/app/logs \
            batch-ml-project1:${{ github.sha }}

      - name: Upload prediction outputs
        uses: actions/upload-artifact@v4
        with:
          name: prediction-output
          path: |
            output/
            logs/
            archive/

  analyze:
    name: Analyze Run With Ollama + RAG
    runs-on: ubuntu-latest
    needs:
      - train
      - predict

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create required folders
        run: |
          mkdir -p models output archive failed logs artifacts vectorstore rag/knowledge_base

      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models

      - name: Download prediction outputs artifact
        uses: actions/download-artifact@v4
        with:
          name: prediction-output
          path: .

      - name: Verify required files exist
        run: |
          test -f models/model.pkl
          test -f data/raw/training_data.csv
          ls -R output || true
          ls -R logs || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Ollama container
        run: |
          docker compose up -d ollama

      - name: Wait for Ollama
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              exit 0
            fi
            echo "Waiting for Ollama..."
            sleep 2
          done
          echo "Ollama did not become ready in time"
          docker compose logs ollama || true
          exit 1

      - name: Pull Ollama models
        run: |
          docker compose exec -T ollama ollama pull llama3.2:3b
          docker compose exec -T ollama ollama pull nomic-embed-text

      - name: Run evaluation
        run: |
          python src/evaluate.py

      - name: Build run payload
        run: |
          python src/build_run_payload.py

      - name: Ingest RAG knowledge base
        env:
          OLLAMA_EMBED_URL: http://127.0.0.1:11434/api/embeddings
          EMBED_MODEL: nomic-embed-text
        run: |
          python src/ingest_rag.py

      - name: Run P3 analysis
        env:
          OLLAMA_MODEL: llama3.2:3b
          OLLAMA_HOST: http://127.0.0.1:11434
          OLLAMA_EMBED_URL: http://127.0.0.1:11434/api/embeddings
          EMBED_MODEL: nomic-embed-text
        run: |
          python src/p3_analyze.py

      - name: Show generated artifacts
        run: |
          ls -R artifacts || true
          echo "----- llm_summary.md -----"
          cat artifacts/llm_summary.md || true

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p3-analysis-artifacts
          path: |
            artifacts/
            vectorstore/

      - name: Show Ollama logs on failure
        if: failure()
        run: |
          docker compose logs ollama || true

      - name: Stop Ollama container
        if: always()
        run: |
          docker compose down || true
